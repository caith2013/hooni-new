<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hooni - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .login-header p {
            color: #999;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 14px;
            border-left: 4px solid #c33;
        }

        .error-list {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 14px;
            border-left: 4px solid #c33;
        }

        .error-list li {
            margin-left: 20px;
            margin-bottom: 5px;
        }

        .success-message {
            background: #efe;
            color: #3c3;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 14px;
            border-left: 4px solid #3c3;
        }

        .login-footer {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .login-footer p {
            color: #999;
            font-size: 14px;
        }

        .login-footer a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }

        .session-info {
            background: #f0f0f0;
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            color: #999;
            margin-bottom: 20px;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 30px 20px;
                max-width: 90%;
            }

            .login-header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>Hooni</h1>
            <p>Sign in to your account</p>
        </div>

        <!-- Error Messages -->
        <div th:if="${errorMessage}" class="error-message" th:text="${errorMessage}"></div>

        <!-- Validation Errors -->
        <div th:if="${errors}" class="error-list">
            <ul>
                <li th:each="err : ${errors}" th:text="${err.key} + ': ' + ${err.value}"></li>
            </ul>
        </div>

        <!-- Session Info (for debugging) -->
        <div class="session-info" th:if="${sessionId}">
            <strong>Session ID:</strong> <span th:text="${sessionId}"></span>
        </div>

        <!-- Login Form -->
        <form method="POST" action="/login">
            <div class="form-group">
                <label for="userName">Username</label>
                <input 
                    type="text" 
                    id="userName" 
                    name="userName" 
                    placeholder="Enter your username"
                    required
                    autofocus>
            </div>

            <div class="form-group">
                <label for="passwd">Password</label>
                <input 
                    type="password" 
                    id="passwd" 
                    name="passwd" 
                    placeholder="Enter your password"
                    required>
            </div>

            <div class="form-group">
                <label for="vsc">Security Code</label>
                <input 
                    type="text" 
                    id="vsc" 
                    name="vsc" 
                    placeholder="Enter security code"
                    required>
            </div>

            <!-- Hidden redirect URL -->
            <input 
                type="hidden" 
                name="redirect" 
                th:value="${redirect}">

            <!-- CSRF Token (auto-generated by Spring Security) -->
            <input 
                type="hidden" 
                name="_csrf" 
                th:value="${_csrf?.token}">

            <button type="submit" class="btn-login">Sign In</button>
        </form>

        <div class="login-footer">
            <p>
                Don't have an account? 
                <a href="/register">Register here</a>
            </p>
        </div>
    </div>

    <script>
        // Auto-focus on first error field
        const errorList = document.querySelector('.error-list');
        if (errorList) {
            const firstInput = document.querySelector('input[type="text"], input[type="password"]');
            if (firstInput) {
                firstInput.focus();
            }
        }
    </script>
</body>
</html>
