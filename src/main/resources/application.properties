# ============================================================
# Hooni Web Application - Spring Boot Configuration
# Migrated from: Tomcat 8 + plain Servlet + Freemarker + Hibernate
# ============================================================

# Server
server.port=8080
server.address=0.0.0.0
spring.mvc.dispatch-options-request=true
server.servlet.context-path=/

# Connection pool (HikariCP - Spring Boot default)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=40000

# JPA / Hibernate
# Original dialect from hibernate.cfg.xml: MySQL5Dialect
# Updated for Hibernate 6.x: MySQL8Dialect renamed to MySQLDialect
# Explicitly set dialect for Hibernate 7.x to avoid connection issues during startup
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
# Naming strategy: use exact column names from @Column annotations (no auto-conversion to snake_case)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# Legacy schema is managed externally (imported from dump); do not auto-alter it.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.current_session_context_class=thread
spring.jpa.properties.hibernate.auto_quote_keyword=true
spring.jpa.open-in-view=false

# Prevent Hibernate from crashing on boot if the database metadata check drops
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false


# Freemarker
# Templates were previously loaded from the webapp root via WebappTemplateLoader.
# Spring Boot Freemarker loads from classpath:/templates/ by default.
spring.freemarker.template-loader-path=classpath:/templates/
spring.freemarker.suffix=.ftl
spring.freemarker.charset=UTF-8
spring.freemarker.cache=false
# Set to true in production:
# spring.freemarker.cache=true
spring.freemarker.settings.default_encoding=UTF-8
spring.freemarker.settings.output_encoding=UTF-8
spring.freemarker.settings.locale=en_US

# Session
server.servlet.session.timeout=1d
server.servlet.session.cookie.name=HOONI_SESSION

# Mail (used by EmailSender / TemplateEmailSender)
# Fill in your SMTP settings.
spring.mail.host=smtp.example.com
spring.mail.port=587
spring.mail.username=your-email@example.com
spring.mail.password=your-email-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Multipart / File Upload
# FoodsController and ProductManagerController handle multipart file uploads.
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# Logging
# Original code used Log4j. Spring Boot uses SLF4J + Logback.
# Replace log4j Logger with SLF4J: import org.slf4j.Logger / LoggerFactory
logging.level.com.hooni=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

# Application-specific constants
hooni.domain=hooni.org
hooni.default-encoding=UTF-8
hooni.template-update-delay=36000
# Disable default BasicErrorController so custom `ErrorController` can handle /error
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.web.servlet.error.ErrorMvcAutoConfiguration
