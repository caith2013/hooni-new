# DataSource (MySQL)
# Update the URL, username, and password to match your environment.
# Original values were found in hibernate.cfg.xml:
#   url:      jdbc:mysql://localhost/mydb
#   username: root
#   password: root
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mydb}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
#spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mydb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Local Development Profile
app.images.path=${IMAGES_PATH:C:/hooniImages/}

# Redis (standalone local instance)
spring.redis.host=${SPRING_REDIS_HOST:localhost}
spring.redis.port=${SPRING_REDIS_PORT:6379}
spring.redis.timeout=${SPRING_REDIS_TIMEOUT:2000}
spring.redis.ssl=${SPRING_REDIS_SSL:false}
