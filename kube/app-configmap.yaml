apiVersion: v1
kind: ConfigMap
metadata:
  name: hooni-config
data:
  DB_HOST: "mysql"
  DB_PORT: "3306"
  DB_NAME: "mydb"
  DB_USER: "root"
  SPRING_PROFILES_ACTIVE: "docker"
  SPRING_REDIS_HOST: "redis"
  SPRING_REDIS_PORT: "6379"
  application.properties: |
    # Server Configuration
    server.port=8080
    server.address=0.0.0.0
    server.servlet.context-path=/

    # Dynamic Kubernetes DataSource Configuration
    spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    spring.datasource.username=${DB_USER}
    spring.datasource.password=${DB_PASSWORD}
    spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

    # Connection pool
    spring.datasource.hikari.maximum-pool-size=10
    spring.datasource.hikari.minimum-idle=2
    spring.datasource.hikari.connection-timeout=20000

    # Redis Configuration
    spring.redis.host=${SPRING_REDIS_HOST}
    spring.redis.port=${SPRING_REDIS_PORT}

    # JPA / Hibernate
    spring.jpa.hibernate.ddl-auto=update
    spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    spring.jpa.properties.hibernate.globally_quoted_identifiers=true
    spring.jpa.show-sql=true
    spring.jpa.open-in-view=false

    # Freemarker
    spring.freemarker.template-loader-path=classpath:/templates/
    spring.freemarker.suffix=.ftl
    spring.freemarker.charset=UTF-8

    # Session
    server.servlet.session.timeout=1d
    server.servlet.session.cookie.name=HOONI_SESSION

    # Multipart / File Upload
    spring.servlet.multipart.enabled=true
    spring.servlet.multipart.max-file-size=10MB
    spring.servlet.multipart.max-request-size=20MB

    # Logging
    logging.level.org.springframework.web=INFO

    # Mount Path for uploaded files
    app.images.path=/images/
    spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.web.servlet.error.ErrorMvcAutoConfiguration
