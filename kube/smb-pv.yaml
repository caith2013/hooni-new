apiVersion: v1
kind: PersistentVolume
metadata:
  name: windows-share-pv
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: smb.csi.k8s.io
    volumeHandle: windows-share-volume-id
    volumeAttributes:
      # Use your actual Windows host IP and shared directory name
      source: "//192.168.1.160/hooniImages" # CHANGE THIS LINE
    nodeStageSecretRef:
      name: smbcreds # CHANGE THIS LINE (removed the hyphen)
      namespace: default
