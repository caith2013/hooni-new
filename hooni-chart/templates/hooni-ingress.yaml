apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hooni-app
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  rules:
    - host: {{ .Values.hooniApp.hostname | default "hooni.local" }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hooni-app
                port:
                  number: {{ .Values.hooniApp.servicePort }}

