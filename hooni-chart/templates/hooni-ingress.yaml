apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hooni-app
  namespace: hooni
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - {{ .Values.hooniApp.hostname | quote | default "hoo-ni.com" }}
        - "www.{{ .Values.hooniApp.hostname | default "hoo-ni.com" }}"
      secretName: {{ .Values.hooniApp.tlsSecretName | default "ionos-ssl-secret" }}
  rules:
    - host: {{ .Values.hooniApp.hostname | default "hoo-ni.com" }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hooni-app
                port:
                  number: {{ .Values.hooniApp.servicePort | default 80 }}
    - host: "www.{{ .Values.hooniApp.hostname | default "hoo-ni.com" }}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hooni-app
                port:
                  number: {{ .Values.hooniApp.servicePort }}
