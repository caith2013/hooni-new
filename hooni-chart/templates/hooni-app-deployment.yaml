apiVersion: apps/v1
kind: Deployment
metadata:
  name: hooni-app
spec:
  replicas: {{ .Values.hooniApp.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: hooni-app
  template:
    metadata:
      labels:
        app: hooni-app
    spec:
      containers:
        - name: hooni-app
          image: {{ .Values.hooniApp.image }}
          imagePullPolicy: {{ .Values.hooniApp.imagePullPolicy | default "IfNotPresent" }}
          envFrom:
            - configMapRef:
                name: hooni-app-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: hooni-db-secret
                  key: db-user

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hooni-db-secret
                  key: db-password
          volumeMounts:
            - name: shared-nfs-volume
              mountPath: {{ .Values.hooniImages.imagesPath | default "/storage/hooniImages" }}
          ports:
            - containerPort: {{ .Values.hooniApp.servicePort | default 80 }}
      volumes:
        - name: shared-nfs-volume
          persistentVolumeClaim:
            claimName: shared-nfs-pvc